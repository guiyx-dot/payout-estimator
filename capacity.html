<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打款产能报表</title>
  <link rel="stylesheet" href="./styles.css?v=30" />
</head>
<body class="page-capacity">
  <header class="dash-top">
    <h1>打款产能报表</h1>
    <div class="dash-pills">
      <span>内部方案实例</span>
      <div class="date-wrap" id="date-wrap">
        <button type="button" class="date-btn" id="date-btn">2026-11-02</button>
        <div class="date-pop" id="date-pop" hidden>
          <div class="date-presets">
            <button type="button" data-range="day">当天</button>
            <button type="button" data-range="7">近7日</button>
            <button type="button" data-range="30">近30日</button>
          </div>
          <div class="date-fields">
            <label>开始<input type="date" id="date-from" min="2026-10-01" max="2026-11-05" value="2026-11-02" /></label>
            <label>结束<input type="date" id="date-to" min="2026-10-01" max="2026-11-05" value="2026-11-02" /></label>
          </div>
        </div>
      </div>
      <span id="used-pill">模拟当日已用</span>
      <span>方案划分模拟</span>
    </div>
    <a class="text-btn" href="./index.html">周期估算</a>
  </header>

  <div class="dash-row">
  <section class="dash-card cap-filters look-chips" id="cap-filters">
    <p class="dash-label">筛选条件</p>
    <div class="filter-line">
      <span>场景</span>
      <div class="seg filter">
        <button type="button" data-scene="" class="on">全部</button>
        <button type="button" data-scene="新车">新车</button>
        <button type="button" data-scene="续保">续保</button>
        <button type="button" data-scene="事故车">事故车</button>
      </div>
    </div>
    <div class="filter-line">
      <span>转出</span>
      <div class="seg filter">
        <button type="button" data-method="" class="on">全部</button>
        <button type="button" data-method="微信">微信</button>
        <button type="button" data-method="支付宝">支付宝</button>
        <button type="button" data-method="银行卡">银行卡</button>
      </div>
    </div>
    <div class="filter-line">
      <span>方案</span>
      <div class="seg filter">
        <button type="button" data-scheme="" class="on">全部</button>
        <button type="button" data-scheme="连续劳务">连续劳务</button>
        <button type="button" data-scheme="非税方案">非税方案</button>
      </div>
    </div>
    <div class="filter-line">
      <span>状态</span>
      <div class="seg filter">
        <button type="button" data-status="" class="on">全部</button>
        <button type="button" data-status="充足">充足</button>
        <button type="button" data-status="紧张">紧张</button>
        <button type="button" data-status="耗尽">耗尽</button>
        <button type="button" data-status="未知">未知</button>
      </div>
    </div>
    <div id="cap-split"></div>
  </section>
  <section class="dash-card" id="cap-chart"></section>
  </div>

  <div id="view" class="cap-view"></div>

  <script src="./capacity.js?v=30"></script>
</body>
</html>
